name: ECDAT Cryptographic Defense Gate

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

jobs:
  crypto-gate:
    name: ECDAT Crypto Gate — Shift-Left PQC Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      ecdat-backend:
        image: python:3.11-slim
        # Backend is started as a step below (not a Docker service)
        # This is a placeholder; actual backend spun up in steps

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Python setup for gate script ────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── System libs for WeasyPrint / PDF generation ─────────────
      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libjpeg-dev libopenjp2-7-dev libffi-dev

      # ── Backend dependencies ─────────────────────────────────────
      - name: Install ECDAT Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ── Start backend in background ──────────────────────────────
      - name: Start ECDAT Backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CORS_ORIGINS: "http://localhost:3000"
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Backend PID: $!"
          # Wait until health endpoint responds
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "✅ Backend is up after ${i}s"
              break
            fi
            echo "Waiting for backend... (${i}/30)"
            sleep 2
          done

      # ── Run the ECDAT gate on Quantum-Safe repo ────────────────────
      - name: Verify Quantum-Safe Repository Gate
        env:
          ECDAT_BACKEND_URL: "http://localhost:8000"
        run: |
          python scripts/ecdat_gate.py \
            --backend-url "$ECDAT_BACKEND_URL" \
            --repo-root demo_quantum_safe_repo \
            --fail-on-critical

      # ── Demonstrate Shift-Left Audit on Enterprise Codebase ─────
      - name: Demonstrate Shift-Left Audit on Enterprise Codebase
        env:
          ECDAT_BACKEND_URL: "http://localhost:8000"
        run: |
          python scripts/ecdat_gate.py \
            --backend-url "$ECDAT_BACKEND_URL" \
            --repo-root demo_enterprise_repo

      # ── Upload CBOM artifact (always, so devs can download) ──────
      - name: Download & Upload CBOM Artifact
        if: always()
        run: |
          LATEST_SCAN=$(curl -sf http://localhost:8000/api/scans?limit=1 | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['scan_id'] if d else '')" 2>/dev/null || echo "")
          if [ -n "$LATEST_SCAN" ]; then
            curl -sf "http://localhost:8000/api/export/cbom/$LATEST_SCAN" -o cbom.json 2>/dev/null || true
            echo "CBOM downloaded for scan: $LATEST_SCAN"
          fi

      - name: Upload CBOM to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecdat-cbom-${{ github.sha }}
          path: cbom.json
          if-no-files-found: ignore
          retention-days: 30
