server {
    listen 443 ssl;
    server_name demo.ecdat-ntro.gov.in;

    # ⚠️ QUANTUM VULNERABLE: TLS 1.0 and 1.1 enabled (should be TLS 1.3 only)
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    # ⚠️ QUANTUM VULNERABLE: Weak cipher suites enabled
    # RSA key exchange (no forward secrecy), AES-128, RC4, 3DES all present
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:RSA:DES-CBC3-SHA:RC4-SHA:AES128-SHA';

    # ⚠️ MISSING: ssl_prefer_server_ciphers on (clients may negotiate weaker ciphers)
    ssl_prefer_server_ciphers off;

    ssl_certificate     /etc/nginx/certs/server.pem;     # RSA-2048 cert — BROKEN
    ssl_certificate_key /etc/nginx/certs/server.key;

    # ⚠️ MISSING: HSTS header — no forced HTTPS
    # ⚠️ MISSING: OCSP stapling
    # ⚠️ MISSING: ssl_session_tickets off (session ticket keys often not rotated)

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name demo.ecdat-ntro.gov.in;
    # ⚠️ No redirect to HTTPS — allows plain HTTP traffic
    # Should be: return 301 https://$host$request_uri;
    root /var/www/html;
}
